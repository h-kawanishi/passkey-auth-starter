<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新規登録 - passkey-auth-starter</title>
</head>
<body data-page="signup">
  <main>
    <h1>新規登録</h1>
    <form method="post" action="/signup" data-json>
      <p>
        <label for="email">メールアドレス</label><br>
        <!-- メールアドレスはパスワード再設定（回復）の連絡先。ログインの要素には使わない（S11） -->
        <input id="email" name="email" type="email" autocomplete="username" required>
      </p>
      <p>
        <!-- パスキーで登録する場合はパスワードは要らない（ボタンは JavaScript で動き、この欄を見ない） -->
        <button id="passkey-signup" type="button">パスキーで登録</button>
      </p>
      <p>またはパスワードで登録する:</p>
      <p>
        <label for="password">パスワード（15 文字以上）</label><br>
        <!-- S2: 貼り付けを妨げない（パスワード管理ツールで長い値を使えるように）。maxlength も付けない -->
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="15" required
               aria-describedby="password-hint">
        <br><small id="password-hint">記号や数字を混ぜる必要はありません。覚えやすい長い文やことばの組み合わせがおすすめです。</small>
      </p>
      <p id="message" data-message aria-live="polite"></p>
      <p><button type="submit">登録する</button></p>
    </form>
    <p><a href="/login">ログインはこちら</a></p>
  </main>
  <script src="/assets/simplewebauthn-browser.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
