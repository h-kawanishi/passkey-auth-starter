<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新規登録 - passkey-auth-starter</title>
</head>
<body>
  <main>
    <h1>新規登録</h1>
    <!-- TODO(C): 「パスキーで登録」ボタン -->
    <form method="post" action="/signup" data-json>
      <p>
        <label for="email">メールアドレス</label><br>
        <input id="email" name="email" type="email" autocomplete="username" required>
      </p>
      <p>
        <label for="password">パスワード（15 文字以上）</label><br>
        <!-- S2: 貼り付けを妨げない（パスワード管理ツールで長い値を使えるように）。maxlength も付けない -->
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="15" required
               aria-describedby="password-hint">
        <br><small id="password-hint">記号や数字を混ぜる必要はありません。覚えやすい長い文やことばの組み合わせがおすすめです。</small>
      </p>
      <p data-message aria-live="polite"></p>
      <p><button type="submit">登録する</button></p>
    </form>
    <p><a href="/login">ログインはこちら</a></p>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
