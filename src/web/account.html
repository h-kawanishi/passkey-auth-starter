<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アカウント設定 - passkey-auth-starter</title>
</head>
<body data-page="account">
  <main>
    <h1>アカウント設定</h1>
    <p>ログイン中: <strong id="account-email" data-me-email></strong></p>
    <p id="message" aria-live="polite"></p>

    <section>
      <h2>パスキー</h2>
      <ul id="passkey-list"></ul>
      <form id="add-passkey">
        <label>名前（例: 仕事用ノートPC）
          <input id="device-name" name="deviceName" maxlength="64">
        </label>
        <button type="submit">パスキーを追加</button>
      </form>

      <!-- パスキーの追加の前に求める本人確認（5 分間有効）。サーバーが求めたときに開く -->
      <div id="reauth-section" hidden>
        <h3>本人確認</h3>
        <p>パスキーを追加する前に、本人であることを確かめます。確認してから 5 分以内に「パスキーを追加」を押してください。</p>
        <form id="reauth-password-form" hidden>
          <p>
            <label for="reauth-password">現在のパスワード</label><br>
            <input id="reauth-password" name="password" type="password" autocomplete="current-password" required>
          </p>
          <p><button type="submit">パスワードで確認</button></p>
        </form>
        <p id="reauth-passkey-row" hidden><button type="button" id="reauth-passkey">登録済みのパスキーで確認</button></p>
        <p id="reauth-message" aria-live="polite"></p>
      </div>
    </section>

    <section id="password-section" hidden>
      <h2>パスワードの変更</h2>
      <form method="post" action="/account/password" data-json>
        <p>
          <label for="current-password">現在のパスワード</label><br>
          <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required>
        </p>
        <p>
          <label for="new-password">新しいパスワード（15 文字以上）</label><br>
          <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="15" required>
        </p>
        <p data-message aria-live="polite"></p>
        <p><button type="submit">変更する</button></p>
      </form>
    </section>

    <section id="no-password-section" hidden>
      <h2>パスワード</h2>
      <p>このアカウントはパスキーだけで使っています。パスワードも使えるようにしたいときは、
        ログアウトしてから<a href="/reset">パスワードの再設定</a>でメールを受け取ってください。</p>
    </section>

    <section>
      <h2>ログアウト</h2>
      <form method="post" action="/logout" data-json>
        <p data-message aria-live="polite"></p>
        <button type="submit">この端末でログアウト</button>
      </form>
      <form method="post" action="/logout/all" data-json>
        <p data-message aria-live="polite"></p>
        <button type="submit">すべての端末でログアウト</button>
      </form>
    </section>
  </main>
  <script src="/assets/simplewebauthn-browser.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
