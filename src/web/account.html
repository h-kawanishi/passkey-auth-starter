<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アカウント設定 - passkey-auth-starter</title>
</head>
<body data-page="account">
  <main>
    <h1>アカウント設定</h1>
    <p>ログイン中: <strong id="account-email" data-me-email></strong></p>
    <p id="message" aria-live="polite"></p>

    <section>
      <h2>パスキー</h2>
      <ul id="passkey-list"></ul>
      <form id="add-passkey">
        <label>名前（例: 仕事用ノートPC）
          <input id="device-name" name="deviceName" maxlength="64">
        </label>
        <button type="submit">パスキーを追加</button>
      </form>
    </section>

    <section id="password-section" hidden>
      <h2>パスワードの変更</h2>
      <form method="post" action="/account/password" data-json>
        <p>
          <label for="current-password">現在のパスワード</label><br>
          <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required>
        </p>
        <p>
          <label for="new-password">新しいパスワード（15 文字以上）</label><br>
          <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="15" required>
        </p>
        <p data-message aria-live="polite"></p>
        <p><button type="submit">変更する</button></p>
      </form>
    </section>

    <section id="no-password-section" hidden>
      <h2>パスワード</h2>
      <p>このアカウントはパスキーだけで使っています。</p>
      <!-- TODO(D): パスワードの再設定（メール）でパスワードを足せることを案内する -->
    </section>

    <section>
      <h2>ログアウト</h2>
      <form method="post" action="/logout" data-json>
        <p data-message aria-live="polite"></p>
        <button type="submit">この端末でログアウト</button>
      </form>
      <form method="post" action="/logout/all" data-json>
        <p data-message aria-live="polite"></p>
        <button type="submit">すべての端末でログアウト</button>
      </form>
    </section>
  </main>
  <script src="/assets/simplewebauthn-browser.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
